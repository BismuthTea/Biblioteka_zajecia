{% extends "biblioteka/base.html" %}

{% block title %}Dodaj nową osobę{% endblock %}

{% block content %}
<h1>Dodaj nową osobę</h1>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %} <!-- zabezpieczenie przed atakami CSRF Django wymaga tego w formularzach POST -->
        <label for="first_name">Imię:</label>
        <input type="text" id="first_name" name="first_name"><br><br>

        <label for="last_name">Nazwisko:</label>
        <input type="text" id="last_name" name="last_name"><br><br>

        <label for="sex">Płeć:</label>
        <select id="sex" name="sex">
            <option value="1">mężczyzna</option>
            <option value="2">kobieta</option>
            <option value="3">inna</option>
        </select><br><br>

        <label for="Stanowisko">Stanowisko:</label>
        <select id="Stanowisko" name="Stanowisko">
            {% for s in stanowiska %}
                <option value="{{ s.id }}">{{ s.nazwa }}</option>
            {% endfor %}
        </select><br><br>

        <button type="submit">Zapisz</button>
    </form>
{% endblock %}
